name: CI - Semantic Release

# This workflow is triggered on every push to the main branch
# It analyzes commits and automatically releases a new version when needed
on:
    push:
        branches: [main]

jobs:
    release:
        name: Semantic Release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Set executable permissions
              run: chmod +x dist/index.js

            - name: Verify tests
              run: npm test

            - name: Configure Git User
              run: |
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git config --global user.name "github-actions[bot]"

            - name: Get npm OIDC token
              run: |
                  OIDC_TOKEN=$(curl -sS \
                    -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm" \
                    | jq -r '.value')
                  NPM_TOKEN=$(curl -sS \
                    -X POST \
                    -H "Content-Type: application/json" \
                    -d "{\"oidc_token\": \"$OIDC_TOKEN\"}" \
                    https://registry.npmjs.org/-/npm/v1/token/oidc \
                    | jq -r '.token')
                  echo "NPM_TOKEN=$NPM_TOKEN" >> $GITHUB_ENV

            - name: Semantic Release
              id: semantic
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ env.NPM_TOKEN }}
              run: npx semantic-release
